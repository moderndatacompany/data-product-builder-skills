[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataproduct-builder-skills"
version = "1.2.3"
description = "Agent skills for designing and building Vulcan/DataOS data products — run via uvx/pipx to scaffold .cursor/.claude/.codex/.github skills and docs into any project."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
dataproduct-builder-skills = "dataproduct_builder_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataproduct_builder_skills = ["data/**/*"]
